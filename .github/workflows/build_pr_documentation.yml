name: Build PR Documentation

on:
  pull_request:
    paths:
      - "docs/source/**"
      - ".github/workflows/build_pr_documentation.yml"
      - ".github/workflows/upload_pr_documentation.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_pr_documentation.yml@7b35a31ae9844db8b177ef3ca869184a79d791f8  # main
    with:
      commit_sha: ${{ github.event.pull_request.head.sha }}
      pr_number: ${{ github.event.number }}
      package: text-embeddings-inference
      additional_args: --not_python_module
      path_to_docs: text-embeddings-inference/docs/source/en/
