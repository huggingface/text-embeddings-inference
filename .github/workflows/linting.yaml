name: Linting Tests

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  run_tests:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest

    env:
      SCCACHE_GHA_ENABLED: "on"
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Select Rust checks
        id: changes
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: context.issue.number, per_page: 100,
            });
            const paths = files.flatMap(file => [file.filename, file.previous_filename].filter(Boolean));
            core.setOutput('ci', paths.some(path => path.startsWith('.github/workflows/')));
            core.setOutput('rust', files.length < context.payload.pull_request.changed_files || paths.some(path =>
              path.endsWith('.rs') || path.endsWith('Cargo.toml') || path === 'Cargo.lock' ||
              path === 'rust-toolchain.toml' || path.startsWith('.cargo/') ||
              path === '.pre-commit-config.yaml' || path.startsWith('.github/workflows/')));
      - name: Install Rust
        if: steps.changes.outputs.rust == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c  # v1.15.2
        with:
          components: rustfmt, clippy
      - name: Install Protoc
        if: steps.changes.outputs.rust == 'true'
        uses: arduino/setup-protoc@149f6c87b92550901b26acd1632e11c3662e381f  # v1.3.0
      - name: Clean unused files
        if: steps.changes.outputs.rust == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android # will release about 10 GB if you don't need Android
          sudo rm -rf /usr/share/dotnet # will release about 20GB if you don't need .NET
      - if: steps.changes.outputs.rust == 'true'
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.10.0
      - name: configure sccache
        if: steps.changes.outputs.rust == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            const {execFileSync} = require('node:child_process');
            const {createHash} = require('node:crypto');
            // Native CPU builds must not share objects across incompatible hosts.
            const features = execFileSync('rustc', ['--print', 'cfg', '-C', 'target-cpu=native']);
            core.exportVariable('SCCACHE_GHA_VERSION', createHash('sha256').update(features).digest('hex').slice(0, 16));
            for (const key of ['ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN', 'ACTIONS_CACHE_SERVICE_V2']) {
              core.exportVariable(key, process.env[key] || '');
            }
      - name: cargo registry cache
        if: steps.changes.outputs.rust == 'true'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.4
        with:
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
      - name: Check gRPC
        if: steps.changes.outputs.rust == 'true'
        run: cargo check --locked -F candle -F grpc --no-default-features
      - name: Pre-commit checks
        env:
          SKIP: ${{ steps.changes.outputs.rust != 'true' && 'fmt,cargo-check,clippy' || '' }}
        run: |
          pip install pre-commit
          pre-commit run --all-files
      - name: Validate changed workflows
        if: steps.changes.outputs.ci == 'true'
        run: |
          curl -fsSLo /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
      - name: sccache stats
        if: always() && steps.changes.outputs.rust == 'true'
        run: |
          sccache --show-stats
